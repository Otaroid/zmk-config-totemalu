# enable zmk studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# go to sleep after one hour (1*60*60*1000 ms), matching the Corne config
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# report battery level to the host, and relay the peripheral half's level
# through the central. The XIAO BLE board already declares the voltage
# divider and the `zmk,battery` chosen node, so no devicetree work is needed.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
